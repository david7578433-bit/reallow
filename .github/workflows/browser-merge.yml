name: RealLow browser prices (merge)

# The kosher stores that block simple robots (Refresh, Shlomie's, Evergreen, Wesley, Hatzlacha, Kahan's) are read
# in a real browser off GitHub, twice a day. That run commits data/browser/*.json and starts this workflow, which
# merges those prices into data/groceries.json (keeping the other stores' last robot prices) and republishes Pages.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reallow-robots
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge real-browser prices
        env:
          MERGE_ONLY: "1"
        run: node collectors/groceries.mjs
      - name: Run summary
        run: node collectors/status.mjs
      - name: Commit merged data
        run: |
          git config user.name "RealLow robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only the files this job wrote, on top of the LATEST main (other robots and the browser run commit
          # in between). Never a text merge of two generated files: that mixed two runs' groceries.json once (Nov 3).
          FILES="data/groceries.json data/status.json"
          mkdir -p /tmp/fresh
          for f in $FILES; do if [ -f "$f" ]; then mkdir -p "/tmp/fresh/$(dirname "$f")"; cp "$f" "/tmp/fresh/$f"; fi; done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in $FILES; do if [ -f "/tmp/fresh/$f" ]; then cp "/tmp/fresh/$f" "$f"; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
            git commit -m "Browser prices merged $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
