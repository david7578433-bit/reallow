name: RealLow live online prices (eBay API)

# Every 4 hours (offset 2 h from the main robots, which also run this step) the store-API robot reads live prices
# from eBay's official Browse API (keys are GitHub Actions secrets, never in the repo), writes data/api-prices.json
# (search offers, "Top deals today", and the Online-deals items priced on eBay) and republishes Pages.
# Together with robots.yml the live prices refresh about every 2 hours.
on:
  schedule:
    - cron: "47 2-23/4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reallow-robots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Store APIs (eBay now; AliExpress, Impact, CJ, Rakuten, Amazon when keys exist)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: node collectors/store-apis.mjs
      - name: Run summary
        run: node collectors/status.mjs
      - name: Commit fresh live prices
        run: |
          git config user.name "RealLow robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/api-prices.json data/status.json"
          mkdir -p /tmp/fresh
          for f in $FILES; do if [ -f "$f" ]; then mkdir -p "/tmp/fresh/$(dirname "$f")"; cp "$f" "/tmp/fresh/$f"; fi; done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in $FILES; do if [ -f "/tmp/fresh/$f" ]; then cp "/tmp/fresh/$f" "$f"; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
            git commit -m "Live online prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
